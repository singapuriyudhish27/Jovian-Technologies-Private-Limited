name: Build My NextJS App

on: 
  push: 
    branches: [ main ]

jobs:
  build-next-app:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout New Changes
        uses: actions/checkout@v6.0.3
      - name: Setup Node JS
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.x
      - name: Install Dependencies
        run: npm install
      - name: Build Next App
        run: npm run build
