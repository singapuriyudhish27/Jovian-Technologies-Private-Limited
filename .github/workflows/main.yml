name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: [main]

# Grant permissions required for GitHub Pages deployments
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments from clashing
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout New Changes
        uses: actions/checkout@v4

      - name: Setup Node JS
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install Dependencies
        run: npm ci

      - name: Build Next App
        run: npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out # Next.js outputs static files here when output: 'export' is configured in next.config.mjs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
